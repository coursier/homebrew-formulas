name: CI
on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  macos_build:
    name: MacOS
    strategy:
      fail-fast: true
      matrix:
        os: [macos-15, macos-15-intel, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    env:
      # A bare "coursier" is the homebrew-core formula, installed from its bottle,
      # rather than the one of this repository
      FORMULA: coursier/formulas/coursier
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: |
          brew tap coursier/formulas .
          brew install "$FORMULA"
          brew test "$FORMULA"

      - name: Check the installed version
        run: |
          set -euo pipefail
          expected="$(brew info --json=v2 "$FORMULA" | jq -r '.formulae[0].versions.stable')"
          actual="$(cs version)"
          echo "Formula version: $expected, cs version: $actual"
          test "$actual" = "$expected"
